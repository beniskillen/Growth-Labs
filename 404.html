<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting</title>
<script>
(function () {
  var known = ["/Growth-Labs/","/Growth-Labs/about/","/Growth-Labs/audit/","/Growth-Labs/landing/","/Growth-Labs/partners/","/Growth-Labs/solutions/","/Growth-Labs/studio/","/Growth-Labs/system/","/Growth-Labs/work/mtp-health/"];
  var path = location.pathname;
  var slashed = path.endsWith("/") ? path : path + "/";
  if (known.indexOf(slashed) !== -1 && path !== slashed) {
    location.replace(slashed + location.search + location.hash);
    return;
  }
  location.replace("/Growth-Labs/" + location.search + location.hash);
})();
</script>
</head>
<body>
<p>This page moved. <a href="/Growth-Labs/">Go to Growth Labs</a></p>
</body>
</html>
